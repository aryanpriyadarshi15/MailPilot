<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailPilot</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="brand-icon" aria-hidden="true">M</div>
      <div>
        <h1>MailPilot</h1>
        <p class="subtitle">Your email reply assistant</p>
      </div>
      <span class="status-dot" title="Extension ready"></span>
    </header>

    <section class="form-section">
      <label for="emailContent">Email you received</label>
      <textarea id="emailContent" placeholder="Paste the email you want to reply to..." rows="5"></textarea>

      <label for="replyInstructions" class="instructions-label">What should your reply say?</label>
      <textarea id="replyInstructions" placeholder="E.g., Politely decline and ask if we can reschedule for Friday..." rows="3"></textarea>

      <div class="label-row">
        <label for="tone">Choose a tone</label>
        <span class="optional">Required</span>
      </div>
      <select id="tone">
        <option value="Professional" selected>Professional</option>
        <option value="Friendly">Friendly</option>
        <option value="Casual">Casual</option>
        <option value="Formal">Formal</option>
        <option value="Polite">Polite</option>
        <option value="Confident">Confident</option>
        <option value="Apologetic">Apologetic</option>
        <option value="Persuasive">Persuasive</option>
      </select>

      <button id="generateBtn" class="primary-button" type="button">
        <span id="buttonLabel">Generate reply</span>
        <span class="button-arrow" aria-hidden="true">→</span>
      </button>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite">Ready to generate your reply.</p>
    </section>

    <section id="resultSection" class="result-section" hidden>
      <div class="result-heading">
        <label for="generatedReply">Generated reply</label>
        <button id="copyBtn" class="copy-button" type="button">Copy</button>
      </div>
      <textarea id="generatedReply" rows="7" aria-label="Generated email reply"></textarea>
      <p class="result-hint">Review the reply before sending it.</p>
    </section>

    <footer><span class="footer-mark">✦</span> Made for clearer, faster replies</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
